<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PowerAutomateでテスト</title>
</head>
<body>

<h2>登録テスト</h2>

<input type="text" id="txtName">
<button onclick="saveData()">登録</button>

<div id="saveResult"></div>

<hr>

<h2>検索テスト</h2>

<input type="text" id="txtSearch">
<button onclick="searchData()">検索</button>

<div id="searchResult"></div>

<script>

const SAVE_URL = "https://defaultc8b61927a8e4402d9bae737ebea8e5.6c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/310370d83f914c6ca62b5f62686d4aab/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Zvg9zdny_kiPnGfHSkS_2eyvdznVVM7hiwYt0wdUaLs";
const SEARCH_URL = "https://defaultc8b61927a8e4402d9bae737ebea8e5.6c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/08/workflows/59e341d66cda4ccabfd99ed33bbee5a2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=SxaovbPjdtG54RVlDXLj4zwcMvgu9JBVEYMtxbaSU2s";

async function saveData(){

    const name =
        document.getElementById("txtName").value;

    const res = await fetch(
        SAVE_URL,
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                name:name
            })
        }
    );

    const data = await res.json();

    document.getElementById(
        "saveResult"
    ).innerText =
        "登録完了";
}

async function searchData(){

    const name =
        document.getElementById("txtSearch").value;

    const res = await fetch(
        SEARCH_URL,
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                name:name
            })
        }
    );

    const data = await res.json();

    if(data.exists){
        document.getElementById(
            "searchResult"
        ).innerText =
            "データ有";
    }else{
        document.getElementById(
            "searchResult"
        ).innerText =
            "データ無";
    }
}

</script>

</body>
</html>
