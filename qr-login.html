<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR認証</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:540px;margin:50px auto;padding:28px;background:#fff;border:1px solid #cbd5e1;border-radius:14px;box-shadow:0 8px 24px #0f172a18;text-align:center}.mark{font-size:42px}.test{color:#9a3412;font-weight:700}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px}.stage{margin:18px 0;padding:12px;background:#eef2ff;border-radius:8px;text-align:left;line-height:1.7}.back{display:block;margin-top:20px;color:#075985}</style></head><body><main class="card"><div class="mark">▣</div><p class="test">AWS移行実験版</p><h1 id="title">QRコードを確認しています</h1><p id="message">しばらくお待ちください。</p><div id="stage" class="stage">1. QR認証コードを確認中<br>2. 顧客の公開状態を確認予定</div><a id="back" class="back" href="qr-test.html" hidden>QR認証テストへ戻る</a></main><script src="js/app-config.js"></script><script src="js/auth-client.js"></script><script>
const p=new URLSearchParams(location.search);const title=document.getElementById('title'),message=document.getElementById('message'),back=document.getElementById('back'),stage=document.getElementById('stage');const result=uniformAuth.loginWithQr(p.get('token'),p.get('customer')||'gtYuD7SG',p.get('customerStatus')||'active');if(result.ok){title.textContent='認証と顧客確認が完了しました';message.textContent='白衣採寸WEBを表示します。';stage.innerHTML='1. QR認証コード：有効<br>2. 顧客有効フラグ・公開期限：利用可能';setTimeout(()=>location.replace('index.html?customer='+encodeURIComponent(result.session.customerKey)),900);}else{title.textContent=result.stage==='customer'?'顧客ページを利用できません':'QR認証に失敗しました';message.textContent=result.message;message.className='error';stage.innerHTML=result.stage==='customer'?'1. QR認証コード：有効<br>2. 顧客状態の確認：利用不可':'1. QR認証コード：利用不可<br>2. 顧客状態の確認：未実施';back.hidden=false;}
</script></body></html>
