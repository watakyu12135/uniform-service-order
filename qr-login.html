<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR認証</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:520px;margin:50px auto;padding:28px;background:#fff;border:1px solid #cbd5e1;border-radius:14px;box-shadow:0 8px 24px #0f172a18;text-align:center}.mark{font-size:42px}.test{color:#9a3412;font-weight:700}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px}.back{display:block;margin-top:20px;color:#075985}</style></head><body><main class="card"><div class="mark">▣</div><p class="test">AWS移行実験版</p><h1 id="title">QRコードを確認しています</h1><p id="message">しばらくお待ちください。</p><a id="back" class="back" href="login.html" hidden>通常ログインへ戻る</a></main><script src="js/app-config.js"></script><script src="js/auth-client.js"></script><script>
const p=new URLSearchParams(location.search);const result=uniformAuth.loginWithQr(p.get('token'),p.get('customer')||'gtYuD7SG');const title=document.getElementById('title'),message=document.getElementById('message'),back=document.getElementById('back');if(result.ok){title.textContent='QRコードを確認しました';message.textContent='白衣採寸WEBを表示します。';setTimeout(()=>location.replace('index.html?customer='+encodeURIComponent(result.session.customerKey)),700);}else{title.textContent='QR認証に失敗しました';message.textContent=result.message;message.className='error';back.hidden=false;}
</script></body></html>
