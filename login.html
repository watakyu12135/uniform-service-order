<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白衣採寸WEB ログイン</title>
<style>body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:520px;margin:40px auto;padding:16px}.card{background:#fff;border:1px solid #cbd5e1;border-radius:14px;padding:24px;box-shadow:0 8px 24px #0f172a18}.test{background:#fff7ed;border:2px solid #d97706;color:#7c2d12;border-radius:10px;padding:12px;margin-bottom:18px;font-weight:700}h1{font-size:24px;margin:0 0 8px}.sub{color:#475569;margin-bottom:22px}label{display:block;font-weight:700;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #94a3b8;border-radius:8px;font-size:16px}button,.qr{display:block;box-sizing:border-box;width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:#075985;color:#fff;font-size:16px;font-weight:700;text-align:center;text-decoration:none}.qr{background:#166534}.message{margin-top:14px;padding:10px;border-radius:8px;background:#fee2e2;color:#991b1b}.hint{margin-top:18px;padding:12px;background:#eef2ff;border-radius:8px;font-size:14px;line-height:1.65}@media(max-width:560px){.wrap{margin:10px auto}.card{padding:18px}}</style></head><body>
<div class="wrap"><div class="test">AWS移行実験版です。本物の認証情報は入力しないでください。</div><main class="card"><h1>白衣採寸WEB</h1><p class="sub">ユーザーIDとパスワードを入力してください。</p><form id="loginForm"><label for="userId">ユーザーID</label><input id="userId" autocomplete="username" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">ログイン</button></form><div id="message" class="message" hidden aria-live="polite"></div><a class="qr" href="qr-test.html">QR認証と顧客状態を試す</a><div class="hint"><strong>実験用ログイン情報</strong><br>ユーザーID：TEST<br>パスワード：TEST1234<br><br>現在は画面確認用の仮認証です。AWS移行後はAmazon Cognitoに置き換えます。</div></main></div>
<script src="js/app-config.js?v=7.9"></script><script src="js/auth-client.js?v=7.9"></script><script>
const params = new URLSearchParams(location.search);
const msg = document.getElementById("message");

function showLoginReason() {
  let reason = sessionStorage.getItem("uniformLogoutReason") || "";
  if (!reason && params.get("expired") === "1") reason = "absolute-timeout";

  const messages = {
    "manual": "ログアウトしました。再度利用する場合はログインしてください。",
    "idle-timeout": "一定時間操作がなかったため、ログアウトしました。もう一度ログインしてください。",
    "absolute-timeout": "認証の有効時間が終了しました。もう一度ログインしてください。",
    "unauthenticated": "ログインが必要です。"
  };

  if (reason && messages[reason]) {
    msg.hidden = false;
    msg.textContent = messages[reason];
  }
  sessionStorage.removeItem("uniformLogoutReason");

  // 古いreturnやexpiredをURLから除去し、再読込み時のメッセージ再表示を防ぐ。
  if (location.search) history.replaceState(null, "", location.pathname);
}

showLoginReason();

document.getElementById("loginForm").addEventListener("submit", function (event) {
  event.preventDefault();
  const result = uniformAuth.login(
    document.getElementById("userId").value.trim(),
    document.getElementById("password").value
  );
  if (!result.ok) {
    msg.hidden = false;
    msg.textContent = result.message;
    return;
  }

  // 再ログイン先は必ず認証顧客の空欄の新規入力画面へ統一する。
  const customerKey = encodeURIComponent(result.session.customerKey);
  location.replace("index.html?customer=" + customerKey + "&new=1");
});
</script></body></html>
