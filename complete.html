<script id="uniformI18nRuntime">
(() => {
  "use strict";
  const STORAGE_KEY = "uniformLanguage";
  const DEFAULT_LANGUAGE = "ja";
  const SUPPORTED = ["ja", "en", "vi"];
  let currentLanguage = SUPPORTED.includes(localStorage.getItem(STORAGE_KEY)) ? localStorage.getItem(STORAGE_KEY) : DEFAULT_LANGUAGE;
  let sourceMap = { en: {}, vi: {} };
  let applying = false;

  const normalizeBreaks = value => String(value ?? "").replace(/\\n/g, "\n");
  const escapeRegExp = value => value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  function translateTemplate(text) {
    if (currentLanguage === DEFAULT_LANGUAGE || !text) return text;
    const map = sourceMap[currentLanguage] || {};
    const raw = String(text);
    if (Object.prototype.hasOwnProperty.call(map, raw)) return normalizeBreaks(map[raw]);
    const trimmed = raw.trim();
    if (Object.prototype.hasOwnProperty.call(map, trimmed)) {
      return raw.replace(trimmed, normalizeBreaks(map[trimmed]));
    }
    for (const [ja, translated] of Object.entries(map)) {
      if (!ja.includes("{") || !ja.includes("}")) continue;
      const names = [...ja.matchAll(/\{([^{}]+)\}/g)].map(m => m[1]);
      let pattern = escapeRegExp(ja);
      names.forEach(name => { pattern = pattern.replace(escapeRegExp("{" + name + "}"), "(.+?)"); });
      const match = raw.match(new RegExp("^" + pattern + "$"));
      if (!match) continue;
      let result = normalizeBreaks(translated);
      names.forEach((name, index) => { result = result.replaceAll("{" + name + "}", match[index + 1]); });
      return result;
    }
    return raw;
  }

  function translateNode(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      const before = node.nodeValue;
      const after = translateTemplate(before);
      if (after !== before) node.nodeValue = after;
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    if (node.closest("script,style,[data-i18n-ignore]")) return;
    ["placeholder", "title", "aria-label", "value"].forEach(attr => {
      if (!node.hasAttribute(attr)) return;
      if (attr === "value" && !["BUTTON", "INPUT", "OPTION"].includes(node.tagName)) return;
      const before = node.getAttribute(attr);
      const after = translateTemplate(before);
      if (after !== before) node.setAttribute(attr, after);
    });
    [...node.childNodes].forEach(translateNode);
  }

  function applyLanguage(language) {
    currentLanguage = SUPPORTED.includes(language) ? language : DEFAULT_LANGUAGE;
    localStorage.setItem(STORAGE_KEY, currentLanguage);
    document.documentElement.lang = currentLanguage;
    applying = true;
    translateNode(document.body);
    applying = false;
    document.dispatchEvent(new CustomEvent("uniformLanguageChanged", { detail: { language: currentLanguage } }));
  }

  function createSelector(languageData) {
    if (document.getElementById("uniformLanguageSelector")) return;
    const wrap = document.createElement("div");
    wrap.id = "uniformLanguageSelector";
    wrap.className = "uniform-language-selector";
    wrap.setAttribute("data-i18n-ignore", "true");
    const label = document.createElement("label");
    label.htmlFor = "uniformLanguageSelect";
    label.textContent = "言語 / Language";
    const select = document.createElement("select");
    select.id = "uniformLanguageSelect";
    (languageData.languages || []).sort((a,b) => a.order - b.order).forEach(item => {
      const option = document.createElement("option");
      option.value = item.code;
      option.textContent = item.displayName;
      option.selected = item.code === currentLanguage;
      select.appendChild(option);
    });
    select.addEventListener("change", () => {
      localStorage.setItem(STORAGE_KEY, select.value);
      location.reload();
    });
    wrap.append(label, select);
    document.body.prepend(wrap);
  }

  const originalAlert = window.alert.bind(window);
  const originalConfirm = window.confirm.bind(window);
  window.alert = message => originalAlert(translateTemplate(message));
  window.confirm = message => originalConfirm(translateTemplate(message));
  window.uniformTranslate = translateTemplate;

  Promise.all([
    fetch("languages.json", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error("languages.json"); return r.json(); }),
    fetch("translations.json", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error("translations.json"); return r.json(); })
  ]).then(([languageData, translationData]) => {
    sourceMap = translationData.sourceMap || { en: {}, vi: {} };
    createSelector(languageData);
    applyLanguage(currentLanguage);
    new MutationObserver(records => {
      if (applying || currentLanguage === DEFAULT_LANGUAGE) return;
      applying = true;
      records.forEach(record => record.addedNodes.forEach(translateNode));
      applying = false;
    }).observe(document.body, { childList: true, subtree: true });
  }).catch(error => {
    console.warn("Translation files could not be loaded. Japanese will be displayed.", error);
    createSelector({ languages: [
      { code: "ja", displayName: "日本語", order: 1 },
      { code: "en", displayName: "English", order: 2 },
      { code: "vi", displayName: "Tiếng Việt", order: 3 }
    ]});
  });
})();

/* HTMLメールへ安全に文字を埋め込む */
function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* メール入力一致チェック */
function getEmailInputState() {
  const e1 = document.getElementById("email").value.trim();
  const e2 = document.getElementById("emailConfirm").value.trim();
  const validFormat = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e1);
  if (!e1 && !e2) return "empty";
  if (!e1 || !e2 || e1 !== e2) return "mismatch";
  if (!validFormat) return "invalid";
  return "valid";
}

function checkEmail() {
  const state = getEmailInputState();
  const btn = document.getElementById("mailBtn");
  const message = document.getElementById("emailValidationMessage");
  btn.classList.toggle("hidden", state !== "valid");
  if (state === "mismatch") {
    message.style.color = "#c00";
    message.textContent = "メールアドレスが一致していません。";
  } else if (state === "invalid") {
    message.style.color = "#c00";
    message.textContent = "メールアドレスの形式を確認してください。";
  } else if (state === "valid") {
    message.style.color = "#0a7a2f";
    message.textContent = "✓ メールアドレスが一致しました。";
  } else {
    message.textContent = "";
  }
}

document.getElementById("email").addEventListener("input", checkEmail);

};

function formatMailMeasurementValue(key, value) {
  const text = String(value ?? "").trim();
  if (!text) return "";
  const unit = MAIL_MEASUREMENT_UNIT_MAP[key] || "";
  if (!unit) return text;
  if (text.endsWith(unit)) return text;
  return text + unit;
}

function prepareMailDraftForMail(mailDraft) {
  const orders = Array.isArray(mailDraft.orders)
    ? JSON.parse(JSON.stringify(mailDraft.orders))
    : [];

  const firstOrder = orders[0] || {};
  let measurement = mailDraft.measurement
    ? JSON.parse(JSON.stringify(mailDraft.measurement))
    : null;

  orders.forEach(o => {
    o["姓"] = o["姓"] || o.sei || o["氏"] || "";
    o["名"] = o["名"] || o.mei || "";
    o["セイ"] = o["セイ"] || o.seiKana || o["シ"] || "";
    o["メイ"] = o["メイ"] || o.meiKana || o["メイ"] || "";


    delete o.publicKey;
    delete o.customerKey;
    delete o.customer;
  });

  if (measurement) {
    measurement["姓"] = measurement["姓"] || measurement.sei || measurement["氏"] || firstOrder["姓"] || firstOrder.sei || firstOrder["氏"] || "";
    measurement["名"] = measurement["名"] || measurement.mei || firstOrder["名"] || firstOrder.mei || "";
    measurement["セイ"] = measurement["セイ"] || measurement.seiKana || measurement["シ"] || firstOrder["セイ"] || firstOrder.seiKana || firstOrder["シ"] || "";
    measurement["メイ"] = measurement["メイ"] || measurement.meiKana || firstOrder["メイ"] || firstOrder.meiKana || "";

    Object.keys(measurement).forEach(key => {
      if (MAIL_MEASUREMENT_HIDE_KEYS.has(key)) {
        delete measurement[key];
        return;
      }
      const value = measurement[key];
      if (value === null || value === undefined || String(value).trim() === "") {
        delete measurement[key];
        return;
      }
      measurement[key] = formatMailMeasurementValue(key, value);
    });

    // 旧項目名が混ざる場合はメール表示用から削除する
    delete measurement.sei;
    delete measurement.mei;
    delete measurement.seiKana;
    delete measurement.meiKana;
  }

  const firstAfterNormalize = orders[0] || {};
  const registeredGender = String(firstAfterNormalize.gender || firstAfterNormalize["性別"] || "").trim();
  const selectedUniformType = String(firstAfterNormalize.uniformType || firstAfterNormalize["ユニフォームタイプ"] || registeredGender).trim();
  const alternateUniformSelected =
    firstAfterNormalize.alternateUniformSelected === true ||
    firstAfterNormalize.alternateUniformSelected === 1 ||
    String(firstAfterNormalize.alternateUniformSelected || "").toLowerCase() === "true" ||
    Number(firstAfterNormalize["異性ユニフォーム選択"] || 0) === 1 ||
    !!(registeredGender && selectedUniformType && registeredGender !== selectedUniformType);

  return {
    orders,
    measurement,
    alternateUniformSelected,
    seiKana: firstAfterNormalize["セイ"] || firstAfterNormalize["シ"] || firstAfterNormalize.seiKana || "",
    meiKana: firstAfterNormalize["メイ"] || firstAfterNormalize.meiKana || "",
    kanaName: [
      firstAfterNormalize["セイ"] || firstAfterNormalize["シ"] || firstAfterNormalize.seiKana || "",
      firstAfterNormalize["メイ"] || firstAfterNormalize.meiKana || ""
    ].filter(Boolean).join(" ")
  };
}

                <th style="padding:9px 10px;border:1px solid #d9e1ea;background:#eef4fa;text-align:left;">色</th>
                <th style="padding:9px 10px;border:1px solid #d9e1ea;background:#eef4fa;">サイズ</th>
                <th style="padding:9px 10px;border:1px solid #d9e1ea;background:#eef4fa;">数量</th>
                <th style="padding:9px 10px;border:1px solid #d9e1ea;background:#eef4fa;">股下加工</th>
              </tr>
            </thead>
            <tbody>${orderRows || '<tr><td colspan="6" style="padding:10px;border:1px solid #d9e1ea;">商品情報はありません。</td></tr>'}</tbody>
          </table>
        </div>

        ${measurementHtml}

        <div style="margin-top:28px;padding-top:18px;border-top:1px solid #d9e1ea;font-size:13px;color:#555;">
          このメールはユニフォーム申請システムから自動送信されています。<br>
          このメールへの返信はご遠慮ください。
        </div>
      </div>
    </div>
  </div>
</body>
</html>`;
}

/* メール送信 */
document.getElementById("mailBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const emailConfirm = document.getElementById("emailConfirm").value.trim();
  const mailBtn = document.getElementById("mailBtn");

  if (!email || !emailConfirm || email !== emailConfirm) {
    alert("メールアドレスが一致していません。");
    return;
  }

  const rawMailDraft = sessionStorage.getItem("uniformMailDraft");
  let mailDraft = {};

  try {
    mailDraft = rawMailDraft ? JSON.parse(rawMailDraft) : {};
  } catch (e) {
    alert("送信用データの読み込みに失敗しました。");
    return;
  }

  const preparedMailDraft = prepareMailDraftForMail(mailDraft);

  const mailPayload = {
    toEmail: email,
    mailSubject: "【ユニフォーム申請】登録内容の控え",
    mailHtml: buildMailHtml(preparedMailDraft)
  };

  mailBtn.disabled = true;
  mailBtn.innerText = "送信中...";

  try {
    if (!MAIL_FLOW_URL || MAIL_FLOW_URL.includes("HTTP POST URLをここに貼る")) {
      throw new Error("PA_控えメール送信のHTTP POST URLが未設定です。");
    }
    const res = await fetch(MAIL_FLOW_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(mailPayload)
    });
    const text = await res.text();
    if (!res.ok) throw new Error(text || "控えメール送信フローの呼び出しに失敗しました。");
    if (!text) throw new Error("控えメール送信フローの応答が空です。");
    const json = JSON.parse(text);

    if (json.result !== "ok") {
      alert("控えメールの送信に失敗しました。\n時間をおいて再度お試しください。");
      mailBtn.disabled = false;
      mailBtn.innerText = "メールを送信する";
      return;
    }

    alert("控えメールを送信しました。");

    mailBtn.disabled = true;
    mailBtn.innerText = "送信済み";

    sessionStorage.removeItem("uniformMailDraft");
    sessionStorage.removeItem("uniformComplete");

    allowApplicationNavigation = true;
    location.replace("https://www.yahoo.co.jp/");

  } catch (err) {
    alert("控えメール送信中にエラーが発生しました。\n通信環境を確認して、再度お試しください。\n\n" + err.message);

    mailBtn.disabled = false;
    mailBtn.innerText = "メールを送信する";
  }
});

/* 完了後 */
function finish() {
  const state = getEmailInputState();
  if (state !== "empty" && state !== "valid") {
    if (!confirm("控えメールは送信されません。")) return;
  }
  allowApplicationNavigation = true;
  sessionStorage.removeItem("uniformComplete");
  sessionStorage.removeItem("uniformMailDraft");
  location.replace("https://www.yahoo.co.jp/");
}
</script>

</html>
